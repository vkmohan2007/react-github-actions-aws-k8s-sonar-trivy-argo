sonar.projectKey=vkmohan2007_election
sonar.projectName=election

sonar.sources=src

# Test configuration
sonar.tests=src
sonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx,src/**/*.spec.js,src/**/*.spec.jsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/build/**,**/coverage/**,**/*.config.js

# Exclude test files and main entry file from coverage calculations
sonar.coverage.exclusions=src/main.jsx,src/test/**,**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx

sonar.sourceEncoding=UTF-8
