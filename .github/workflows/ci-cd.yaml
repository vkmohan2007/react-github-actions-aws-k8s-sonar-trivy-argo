name: React CI/CD

on:
  push:
    branches:
    - main
    - develop

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write
  packages: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.7.0"
  IMAGE_NAME: react-projects
  REGISTRY: ghcr.io

jobs:

# ============================================================

# 1. INSTALL + TEST + BUILD

# ============================================================

  test:
    name: Install, Test, and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout source
        uses: actions/checkout@v6

      # --------------------------------------------------------
      # Setup pnpm
      # --------------------------------------------------------

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # --------------------------------------------------------
      # Verify versions
      # --------------------------------------------------------

      - name: Verify versions
        run: |
          node --version
          pnpm --version

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --------------------------------------------------------
      # Run tests
      # --------------------------------------------------------

      - name: Run unit tests
        run: pnpm test --watchAll=false --passWithNoTests

      # --------------------------------------------------------
      # Build React application
      # CRA output = build/
      # --------------------------------------------------------

      - name: Build React application
        run: pnpm run build

      # --------------------------------------------------------
      # Inspect build
      # --------------------------------------------------------

      - name: Inspect build
        run: |
          echo "=== React build ==="

          if [ -d build ]; then
            find build -maxdepth 3 -type f | sort
          else
            echo "build directory does not exist"
            exit 1
          fi

    # --------------------------------------------------------
    # Upload coverage
    # --------------------------------------------------------

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

      # --------------------------------------------------------
      # Upload React build
      # --------------------------------------------------------

      - name: Upload React build
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: build/
          if-no-files-found: error
          retention-days: 7

  # ============================================================

  # 2. SONARQUBE CODE QUALITY

  # ============================================================

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10

    steps:

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check SonarQube connectivity
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking SonarQube..."

          curl \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            "${{ secrets.SONAR_HOST_URL }}/api/system/status"

          echo
          echo "SonarQube is reachable"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  # ============================================================
  # 3. TRIVY FILESYSTEM SCAN
  # ============================================================

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # --------------------------------------------------------
      # Checkout source
      # --------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v6

      # --------------------------------------------------------
      # Generate daily cache key
      # --------------------------------------------------------

      - name: Get date for Trivy DB cache key
        id: trivy-date
        shell: bash
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Cache Trivy vulnerability database
      # --------------------------------------------------------

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.trivy-date.outputs.date }}
          restore-keys: |
            trivy-db-

      # --------------------------------------------------------
      # CRITICAL vulnerabilities
      # Job fails if unfixed CRITICAL vulnerabilities are found
      # --------------------------------------------------------

      - name: Trivy scan - CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table

      # --------------------------------------------------------
      # HIGH vulnerabilities
      # Informational only
      # --------------------------------------------------------

      - name: Trivy scan - HIGH
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH
          ignore-unfixed: true
          exit-code: 0
          format: table  

  # ============================================================
# 4. BUILD DOCKER IMAGE
# ============================================================

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - test
      - sonarqube
      - trivy-fs

    steps:

      # --------------------------------------------------------
      # Checkout source
      # --------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v6

      # --------------------------------------------------------
      # Generate automatic version
      # Example: 1.0.125
      # --------------------------------------------------------

      - name: Generate version
        id: version
        shell: bash
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"

          echo "Version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Setup Docker Buildx
      # --------------------------------------------------------

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true

          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:1.0.${{ github.run_number }}
            ${{ env.IMAGE_NAME }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------
      # Save Docker image
      # --------------------------------------------------------

      - name: Save Docker image
        run: |
          docker save \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -o docker-image.tar

      # --------------------------------------------------------
      # Upload Docker image
      # --------------------------------------------------------

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar
          retention-days: 1


# ============================================================
# 5. TRIVY DOCKER IMAGE SCAN
# ============================================================

  trivy-image:
    name: Trivy Docker Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs: docker-build

    steps:

      # --------------------------------------------------------
      # Download Docker image
      # --------------------------------------------------------

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: .

      # --------------------------------------------------------
      # Load Docker image
      # --------------------------------------------------------

      - name: Load Docker image
        run: |
          docker load --input docker-image.tar

      # --------------------------------------------------------
      # Generate daily Trivy DB cache key
      # --------------------------------------------------------

      - name: Get date for Trivy DB cache key
        id: trivy-date
        shell: bash
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Cache Trivy DB
      # --------------------------------------------------------

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.trivy-date.outputs.date }}
          restore-keys: |
            trivy-db-

      # --------------------------------------------------------
      # CRITICAL vulnerabilities
      # Fail pipeline for fixed CRITICAL vulnerabilities
      # --------------------------------------------------------

      - name: Trivy scan - CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      # --------------------------------------------------------
      # HIGH vulnerabilities
      # Informational only
      # --------------------------------------------------------

      - name: Trivy scan - HIGH
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: HIGH
          ignore-unfixed: true
          exit-code: 0



  # ============================================================

  # 6. PUSH IMAGE TO GITHUB CONTAINER REGISTRY

  # ============================================================

  ghcr-push:
    name: Push Docker Image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 10


    needs: trivy-image

    steps:

    - name: Checkout source
      uses: actions/checkout@v6

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true

        tags: |
          ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest

        cache-from: type=gha
        cache-to: type=gha,mode=max


  # ============================================================
# 7. DEPLOY TO AWS EC2
# ============================================================

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs:
      - ghcr-push
      - trivy-image

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          command_timeout: 10m

          script: |
            set -e

            echo "Logging in to GHCR..."

            echo "${{ secrets.GHCR_TOKEN }}" | \
              docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            echo "Pulling image..."

            docker pull \
              ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

            echo "Stopping existing container..."

            docker stop react-projects || true
            docker rm react-projects || true

            echo "Starting new container..."

            docker run -d \
              --name react-projects \
              --restart unless-stopped \
              -p 9999:8080 \
              ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

            echo "Checking container..."

            sleep 5

            docker ps --filter "name=react-projects"

            echo "Testing application..."

            curl \
              --fail \
              --connect-timeout 10 \
              --max-time 30 \
              http://localhost:9999

            echo "Deployment successful."
